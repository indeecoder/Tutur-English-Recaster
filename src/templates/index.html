<!DOCTYPE html>  
<html lang="id">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">  
    <title>Tutur — Temen Latihan Ngomong Inggris</title>  
    <meta name="description" content="Bicara bahasa Inggris sebisamu. Tutur menuliskan kalimatmu dan menunjukkan versi yang lebih natural — realtime, tanpa dihakimi.">  
  
    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">  
  
    <script src="https://cdn.tailwindcss.com"></script>  
    <script>  
        tailwind.config = {  
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }  
        }  
    </script>  
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">  
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>  
  
    <style>  
        html, body { height: 100vh; height: 100dvh; }  
        [x-cloak] { display: none !important; }  
  
        @keyframes rise {  
            from { opacity: 0; transform: translateY(8px); }  
            to   { opacity: 1; transform: none; }  
        }  
        .rise { animation: rise .35s ease-out both; }  
  
        #feed::-webkit-scrollbar { width: 6px; }  
        #feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 999px; }  
        #feed { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.22) transparent; }  
    </style>  
</head>  
<body x-data="tuturApp()" class="bg-black text-white font-sans flex flex-col overflow-hidden">  
  
    <div aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-0 h-72"  
         style="background: radial-gradient(ellipse at 50% 0%, rgba(163,230,53,.08), transparent 65%);"></div>  
  
    <!-- HEADER -->  
    <header class="relative shrink-0 border-b border-white/10 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-3">  
        <div class="flex items-center gap-3 min-w-0">  
            <div class="w-9 h-9 shrink-0 bg-lime-400 text-black rounded-lg flex items-center justify-center">  
                <i class="fa-solid fa-microphone-lines"></i>  
            </div>  
            <div class="min-w-0">  
                <h1 class="font-bold tracking-tight leading-none">Tutur</h1>  
                <p class="text-[11px] text-zinc-400 mt-0.5 truncate">Temen latihan ngomong Inggris</p>  
            </div>  
        </div>  
  
        <div class="flex items-center gap-2 text-[11px] font-medium">  
            <span class="w-2 h-2 rounded-full"  
                  :class="{  
                      'bg-zinc-600': status === 'idle',  
                      'bg-lime-400 animate-pulse': status === 'listening',  
                      'bg-amber-400 animate-pulse': status === 'connecting' || status === 'processing',  
                      'bg-red-500': status === 'error'  
                  }"></span>  
            <span class="text-zinc-400"  
                  x-text="{  
                      idle: 'Siap',  
                      connecting: 'Menghubungkan…',  
                      listening: 'Mendengarkan',  
                      processing: 'Memproses AI…',  
                      error: 'Error'  
                  }[status]"></span>  
        </div>  
    </header>  
  
    <!-- FEED -->  
    <main id="feed" class="relative flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-5">  
        <div x-show="entries.length === 0" class="h-full flex flex-col items-center justify-center text-center text-zinc-500 gap-3">  
            <i class="fa-regular fa-comments text-3xl opacity-80"></i>  
            <p class="text-sm max-w-xs leading-relaxed">Tekan tombol mic, lalu ngomong bahasa Inggris sebisamu. Tutur akan menunjukkan versi naturalnya.</p>  
        </div>  
  
        <template x-for="(e, i) in entries" :key="i">  
            <div class="rise space-y-2">  
                <!-- kalimat user -->  
                <div class="flex justify-end">  
                    <div class="max-w-[85%] sm:max-w-[70%] bg-zinc-800 rounded-2xl rounded-br-md px-4 py-2.5">  
                        <p class="text-[11px] text-zinc-500 mb-0.5">Kamu</p>  
                        <p class="text-sm" x-text="e.you"></p>  
                    </div>  
                </div>  
                <!-- recast -->  
                <div class="flex justify-start">  
                    <div class="max-w-[85%] sm:max-w-[70%] rounded-2xl rounded-bl-md px-4 py-2.5"  
                         :class="e.isNatural ? 'bg-zinc-900 border border-white/10' : 'bg-lime-400 text-black'">  
                        <p class="text-[11px] mb-0.5"  
                           :class="e.isNatural ? 'text-zinc-500' : 'text-black/60'"  
                           x-text="e.isNatural ? 'Sudah natural' : 'Versi natural'"></p>  
                        <p class="text-sm font-medium" x-text="e.native"></p>  
                    </div>  
                </div>  
            </div>  
        </template>  
  
        <!-- Indicator saat AI memproses jeda bicara -->  
        <div x-show="status === 'processing'" x-cloak class="rise flex justify-start">  
            <div class="bg-zinc-900 border border-white/10 rounded-2xl rounded-bl-md px-4 py-2.5 flex items-center gap-2 text-zinc-400 text-xs">  
                <i class="fa-solid fa-circle-notch fa-spin text-lime-400"></i>  
                <span>AI sedang menyempurnakan kalimatmu…</span>  
            </div>  
        </div>  
    </main>  
  
    <!-- CONTROLS -->  
    <footer class="relative shrink-0 border-t border-white/10 px-4 sm:px-8 py-4 flex flex-col items-center gap-2">  
        <p x-show="status === 'error'" x-cloak class="text-xs text-red-400" x-text="errorMessage"></p>  
  
        <button @click="toggleSession()"  
                :disabled="isLoading"  
                class="w-14 h-14 rounded-full flex items-center justify-center transition disabled:opacity-50 relative"  
                :class="isSession ? 'bg-red-500 hover:bg-red-400' : 'bg-lime-400 hover:bg-lime-300 text-black'">  
            <i class="fa-solid"  
               :class="isLoading ? 'fa-circle-notch fa-spin' : (isSession ? 'fa-stop' : 'fa-microphone')"></i>  
            <span x-show="isSession && status === 'listening'" class="absolute -top-1 -right-1 flex h-3.5 w-3.5">  
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lime-400 opacity-75"></span>  
              <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-lime-500"></span>  
            </span>  
        </button>  
        <p class="text-[11px] text-zinc-500" x-text="isSession ? 'Sesi Aktif — Bicara bebas (Ketuk untuk selesai)' : 'Ketuk untuk mulai bicara'"></p>  
    </footer>  
  
    <script>  
        function tuturApp() {  
            return {  
                // state UI  
                status: 'idle',           // idle | connecting | listening | processing | error  
                isSession: false,  
                isLoading: false,  
                errorMessage: '',  
                entries: [],  
  
                // state koneksi  
                sessionId: null,  
                peerConnection: null,  
                dataChannel: null,  
                localStream: null,  
                offerSent: false,  
                pendingCandidates: [],  
  
                async toggleSession() {  
                    if (this.isSession || this.isLoading) {  
                        this.stopSession();  
                    } else {  
                        await this.startSession();  
                    }  
                },  

                async startSession() {  
                    this.isLoading = true;  
                    this.status = 'connecting';  
                    this.errorMessage = '';  
                    this.offerSent = false;  
                    this.pendingCandidates = [];  
                    this.sessionId = Math.random().toString(36).substring(2, 10);  
                    const sessionId = this.sessionId;  
  
                    try {  
                        // 1) ICE config (TURN creds per sesi)  
                        let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];  
                        try {  
                            const r = await fetch('/rtc-config');  
                            if (r.ok) {  
                                const cfg = await r.json();  
                                if (cfg.iceServers?.length) iceServers = cfg.iceServers;  
                            }  
                        } catch (e) {  
                            console.warn('rtc-config gagal, fallback ke STUN', e);  
                        }  
  
                        // 2) Mic constraint teroptimasi untuk WebRTC VAD  
                        this.localStream = await navigator.mediaDevices.getUserMedia({   
                            audio: {  
                                echoCancellation: true,  
                                noiseSuppression: true,  
                                autoGainControl: true,  
                                channelCount: 1  
                            }   
                        });  
  
                        // 3) Peer connection  
                        const pc = new RTCPeerConnection({ iceServers });  
                        this.peerConnection = pc;  
  
                        pc.oniceconnectionstatechange = () => {  
                            if (pc.iceConnectionState === 'failed') {  
                                this.handleFailure('Koneksi ICE gagal. Cek jaringan/TURN.');  
                            } else if (pc.iceConnectionState === 'disconnected') {  
                                console.warn('ICE disconnected');  
                            }  
                        };  
  
                        // ICE candidate buffering  
                        pc.onicecandidate = ({ candidate }) => {  
                            if (!candidate) return;  
                            const body = JSON.stringify({  
                                candidate: candidate.toJSON(),  
                                webrtc_id: sessionId,  
                                type: 'ice-candidate',  
                            });  
                            if (this.offerSent) {  
                                fetch('/webrtc/offer', {  
                                    method: 'POST',  
                                    headers: { 'Content-Type': 'application/json' },  
                                    body,  
                                });  
                            } else {  
                                this.pendingCandidates.push(body);  
                            }  
                        };  
  
                        // Audio send-only  
                        const track = this.localStream.getAudioTracks()[0];  
                        pc.addTransceiver(track, { direction: 'sendonly' });  
  
                        // DataChannel  
                        this.setupDataChannel(pc, sessionId);  
  
                        // 4) WebRTC Offer  
                        const offer = await pc.createOffer();  
                        await pc.setLocalDescription(offer);  
  
                        const resp = await fetch('/webrtc/offer', {  
                            method: 'POST',  
                            headers: { 'Content-Type': 'application/json' },  
                            body: JSON.stringify({  
                                sdp: pc.localDescription.sdp,  
                                type: pc.localDescription.type,  
                                webrtc_id: sessionId,  
                            }),  
                        });  
                        if (!resp.ok) throw new Error(`Offer ditolak: HTTP ${resp.status}`);  
  
                        const answer = await resp.json();  
                        if (answer.status === 'failed') {  
                            throw new Error(  
                                answer.meta?.error === 'concurrency_limit_reached'  
                                    ? `Server penuh (maks ${answer.meta.limit} koneksi).`  
                                    : (answer.meta?.error || 'Server menolak koneksi.')  
                            );  
                        }  
  
                        await pc.setRemoteDescription(answer);  
  
                        // Flush candidate  
                        this.offerSent = true;  
                        this.pendingCandidates.forEach(body =>  
                            fetch('/webrtc/offer', {  
                                method: 'POST',  
                                headers: { 'Content-Type': 'application/json' },  
                                body,  
                            })  
                        );  
                        this.pendingCandidates = [];  
  
                        this.isSession = true;  
                        this.isLoading = false;  
                        if (this.dataChannel?.readyState === 'open') {  
                            this.status = 'listening';  
                        }  
                    } catch (err) {  
                        console.error(err);  
                        this.handleFailure(  
                            err.name === 'NotAllowedError'  
                                ? 'Izin mikrofon ditolak.'  
                                : (err.message || 'Gagal memulai sesi.')  
                        );  
                    }  
                },  

                setupDataChannel(pc, sessionId) {  
                    const dc = pc.createDataChannel('text');  
                    this.dataChannel = dc;  
  
                    dc.onopen = () => {  
                        if (this.isSession) this.status = 'listening';  
                    };  
  
                    dc.onmessage = (e) => {  
                        let msg;  
                        try { msg = JSON.parse(e.data); } catch { return; }  
  
                        if (msg.type === 'error') {  
                            this.handleFailure(msg.data || msg.message || 'Error dari server.');  
                            return;  
                        }  
  
                        if (msg.type === 'fetch_output') {  
                            this.status = 'processing';  
                            this.fetchOutput(sessionId);  
                            return;  
                        }  
  
                        const items = Array.isArray(msg) ? msg : [msg.data ?? msg];  
                        for (const item of items) {  
                            if (item?.you && item?.native) this.pushEntry(item);  
                        }  
                    };  
  
                    dc.onclose = () => {  
                        if (this.isSession) this.handleFailure('Koneksi ke server terputus.');  
                    };  
                },  

                async fetchOutput(sessionId) {  
                    try {  
                        const r = await fetch(`/outputs?webrtc_id=${encodeURIComponent(sessionId)}`);  
                        if (!r.ok) return;  
                        const args = await r.json();  
                          
                        const items = Array.isArray(args) ? args : [args];  
                        for (const item of items) {  
                            if (item?.you && item?.native) {  
                                this.pushEntry(item);  
                            }  
                        }  
                    } catch (e) {  
                        console.error('Gagal mengambil output:', e);  
                    } finally {  
                        if (this.isSession) this.status = 'listening';  
                    }  
                },  

                pushEntry(item) {  
                    const feed = document.getElementById('feed');  
                    const nearBottom =  
                        feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;  
  
                    this.entries.push({  
                        you: item.you,  
                        native: item.native,  
                        isNatural: this.normalize(item.you) === this.normalize(item.native),  
                    });  
                    if (nearBottom) {  
                        this.$nextTick(() => { feed.scrollTop = feed.scrollHeight; });  
                    }  
                },  

                normalize(s) {  
                    return s.toLowerCase().replace(/[.,!?;:'"’]/g, '').replace(/\s+/g, ' ').trim();  
                },  

                stopSession() {  
                    this.isSession = false;  
                    this.isLoading = false;  
                    this.status = 'idle';  
                    this.offerSent = false;  
                    this.pendingCandidates = [];  
                    if (this.dataChannel) {  
                        this.dataChannel.onopen = this.dataChannel.onmessage =  
                        this.dataChannel.onclose = null;  
                        this.dataChannel.close();  
                        this.dataChannel = null;  
                    }  
                    if (this.peerConnection) {  
                        this.peerConnection.oniceconnectionstatechange = null;  
                        this.peerConnection.onicecandidate = null;  
                        this.peerConnection.close();  
                        this.peerConnection = null;  
                    }  
                    if (this.localStream) {  
                        this.localStream.getTracks().forEach(t => t.stop());  
                        this.localStream = null;  
                    }  
                },  

                handleFailure(msg) {  
                    this.stopSession();  
                    this.status = 'error';  
                    this.errorMessage = msg;  
                }  
            }  
        }  
    </script>  
</body>  
</html>
